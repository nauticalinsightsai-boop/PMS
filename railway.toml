# Marketing site (pmstructure.com) — monorepo root service.
# Railway: leave "Root Directory" empty (repo root), or use frontend/railway.toml if set to frontend/.
[build]
builder = "NIXPACKS"
buildCommand = "npm ci --include=dev && npm run build -w @pms/frontend"

[deploy]
startCommand = "npm run start -w @pms/frontend"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
