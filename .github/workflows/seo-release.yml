name: SEO release verify

on:
  push:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - 'scripts/seo/**'
      - 'scripts/legal-seo-check.mjs'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'frontend/**'
      - 'scripts/seo/**'
      - 'scripts/legal-seo-check.mjs'
      - 'package.json'
      - 'package-lock.json'

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build -w @pms/frontend
      - run: npm run seo:all
      - run: npm run seo:postbuild
