name: SEO release verify

on:
  push:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - 'scripts/seo/**'
      - 'scripts/legal-seo-check.mjs'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'frontend/**'
      - 'scripts/seo/**'
      - 'scripts/legal-seo-check.mjs'
      - 'package.json'
      - 'package-lock.json'

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Build frontend
        run: npm run build -w @pms/frontend
        env:
          # Public placeholders so Next can collect page data without repo secrets.
          # Runtime marketing data falls back to file seeds when these are placeholders.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-CITOOLONLY
          NEXT_PUBLIC_META_PIXEL_ID: '0'
      - run: npm run seo:all
      - run: npm run seo:postbuild
