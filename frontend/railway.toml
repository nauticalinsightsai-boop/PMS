# Use when Railway service "Root Directory" is set to frontend/.
[build]
builder = "NIXPACKS"
buildCommand = "cd .. && npm ci --include=dev && npm run build -w @pms/frontend"

[deploy]
startCommand = "npm run start"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
